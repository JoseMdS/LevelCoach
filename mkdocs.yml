site_name: "LevelCoach"
site_description: "Rotationshjälp för leveling i WoW Forever: en ikon med nästa förmåga, avbrottsvarning och redo-cooldowns för de flesta DPS- och tank-specs."
repo_url: https://github.com/JoseMdS/LevelCoach
edit_uri: edit/main/docs/

# techdocs-core ger samma bygge i Backstage TechDocs och på GitHub Pages (tema: Material).
plugins:
  - techdocs-core

markdown_extensions:
  - meta
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - LLD: lld.md
  - Beslut (ADR):
      - adr/index.md
      - ADR-0001 Levande dokumentation: adr/0001-levande-dokumentation.md
      - ADR-0002 Förmågor slås upp på namn, och dolda värden uppska: adr/0002-namnuppslag-och-uppskattning.md
  - Krav: krav.md
  - HLD: hld.md
  - SAD: sad.md
  - Ordlista: ordlista.md
